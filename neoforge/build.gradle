plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    // Epic Fight compat needs raw access to the model cubes, this file is NeoForge only
    def loaderAt = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (loaderAt.exists()) {
        accessTransformers.from(loaderAt.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    repositories {
        maven {
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            url "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Both numbers comes from Curse. The first number is the project_id (on the right) and the second one is the file_id (in the URL)
    runtimeOnly "curse.maven:jei-238222:5466551" // JEI (Just Enough Items)
    //runtimeOnly "curse.maven:citadel-331936:5143956" // Citadel
    //runtimeOnly "curse.maven:rats-323596:4802123" // Rats

    implementation "curse.maven:jei-238222:7014282"
    implementation "thedarkcolour:kotlinforforge-neoforge:5.6.0"
    // Epic Fight 21.17.3.1 (Modrinth version id). Compile only: the compat code is loaded only when the mod is present.
    compileOnly "maven.modrinth:epic-fight:8HHhJt6i"
    runtimeOnly "maven.modrinth:epic-fight:8HHhJt6i" // lets runClient load Epic Fight for testing
    implementation ("dev.isxander:yet-another-config-lib:${project.yacl_version}-neoforge")
}

publishMods {
    file = jar.archiveFile
    modLoaders.add("neoforge")
}