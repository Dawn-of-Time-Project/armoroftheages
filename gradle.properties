# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.7.0
group=org.dawnoftime.armoroftheages
java_version=25

# Common
minecraft_version=26.1.2
minecraft_version_range=[26.1.2, 26.2)
# Version of Minecraft that the 'common' project compiles against, list: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# NeoForge
neoforge_version=26.1.2.114
neoforge_loader_version_range=[4,)

# Fabric
fabric_version=0.155.3+26.1.2
fabric_loader_version=0.19.5

# Configuration
yacl_version=3.9.7+26.1

# Mod options
mod_name=Armor of the Ages
mod_author=Poulpinou & TheGoldenWorld
credits=Mr_ch0c0late, Hahdrim and Aldahel for their models/textures contributions!
mod_id=armoroftheages
license=MIT
description=A mod that adds fancy armors from different cultures.

# Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=false
